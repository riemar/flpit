[project]
name = "flpit"
version = "0.2.3"
description = "Fluent LINQ for Python — flip your iterables"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["linq", "fluent", "iterable", "pipeline", "lazy-evaluation", "pyrefly", "type-safe", "generators"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = [
    "msgspec>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/riemar/flpit"
Repository = "https://github.com/riemar/flpit"
Issues = "https://github.com/riemar/flpit/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.168.0",
    "pyrefly>=1.3.1",
    "pyright>=1.1.414",
    "pytest-benchmark>=5.3.0",
    "mypy>=2.4.0",
    "httpx>=0.28.1",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This tells Hatchling exactly which folders to grab
packages = ["src/flp", "src/flpit"]

[tool.hatch.build.targets.sdist]
# This keeps the exact working sdist inclusion rule you had earlier
include = ["src/flp", "src/flpit"]


[tool.pyrefly]
project-includes = ["src"]
project-excludes = ["**/__pycache__", "tests"]
search-path = ["src", "typing"]
preset = "strict"

[tool.pytest.ini_options]
pythonpath = [
    "src",
    "tests"
]
addopts = "-m 'not benchmark'"
markers = [
    "benchmark: performance benchmarks",
]

