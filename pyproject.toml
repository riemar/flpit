[project]
name = "flpit"
version = "0.1.4.dev1"
description = "Fluent LINQ for Python — flip your iterables"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["linq", "fluent", "iterable", "pipeline", "lazy-evaluation", "pyrefly", "type-safe", "generators"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.168.0",
    "pyrefly>=1.3.1",
    "pyright>=1.1.414",
    "pytest-benchmark>=5.3.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "flp"
module-root = "src"

[tool.pyrefly]
project-includes = ["src"]
project-excludes = ["**/__pycache__", "tests"]
# Entspricht 'typeCheckingMode = "basic"' (nur kritische Bugs/Syntaxfehler abfangen)
preset = "strict"

[tool.pytest.ini_options]
addopts = "-m 'not benchmark'"
markers = [
    "benchmark: performance benchmarks",
]
#[tool.pyrefly]
#extra-paths = ["src", "tests"]
#python-interpreter-path = ".venv/bin/python" # or .venv/Scripts/python.exe on Windows
