site_name: FlpIt
site_description: Fluent LINQ for Python — flip your iterables
site_url: https://riemar.github.io/flpit/
repo_url: https://github.com/riemar/flpit
repo_name: riemar/flpit
edit_uri: edit/main/docs/

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/riemar/flpit
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/flpit/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Why FlpIt: why-flpit.md
  - Guide:
      - Getting started: guide/getting-started.md
      - Lazy and eager: guide/lazy-vs-eager.md
      - Ordering and grouping: guide/ordering-grouping.md
      - Joins and lookups: guide/joins.md
      - JSON: guide/json.md
      - CSV: guide/csv.md
  - Async queries: async/index.md
  - Semantics:
      - What "LINQ semantics" means: semantics/index.md
      - The contract: semantics/contract.md
      - Chaining: semantics/chaining.md
      - Execution characteristics: semantics/execution.md
      - Where FlpIt differs: semantics/differences.md
      - Verification: semantics/verification.md
  - Concurrency:
      - Task runtime: task/index.md
      - Mixing sync and async: task/sync-and-async.md
      - Cancellation: task/cancellation.md
      - Channels: concurrency/channels.md
      - Concurrent collections: concurrency/collections.md
      - Threading primitives: concurrency/threading.md
  - Explore .NET: dotnet.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html  # needed for the card grid on the home page
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      # Resolve includes from the repository root: --8<-- "examples/linq/contract.py:deferred"
      base_path: ["."]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: google
